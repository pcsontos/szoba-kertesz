# Claude code review PR-okra — a HIVATALOS claude-code-action, "gyári" konfigurációval.
# Nincs saját skill, nincs saját agent: csak egy prompt. (L1 a felhőben — 4. alkalom.)
#
# ELŐFELTÉTEL: az ANTHROPIC_API_KEY repo-secret. Enélkül a job minden PR-en elhasal.
#   gh secret set ANTHROPIC_API_KEY --repo pcsontos/szoba-kertesz
name: Claude Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review-old ezt a pull requestet magyarul. Fókusz: hibák, hiányzó
            tesztek, a repo konvencióinak (docs/konvenciók.md) megsértése,
            és a CLAUDE.md invariánsai: elkülönített jogosultsági szintű
            DB-kapcsolatok, framework-agnosztikus core, read-only
            query-tool-lánc, a JSONL-napló és a Trace egymás melletti léte.
            Rövid, tételes összefoglalót írj PR-kommentbe: probléma → fájl:sor → javaslat.
